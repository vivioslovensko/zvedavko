<body>
<header>
  <button class="hbtn" id="homeBtn" aria-label="Domov">🏠</button>
  <h1 id="title">🦉 Zvedavko</h1>
  <div class="stars" id="stars">⭐ 0</div>

<main id="main"></main>

<script>
/* ---------- Úložisko (len v tomto prehliadači) ---------- */
/* ---------- Ukladanie výsledkov ----------
   1) vždy v tomto zariadení (localStorage; ak nejde, aspoň v pamäti),
   2) a navyše do účtu Claude (db), keď je appka otvorená prihláseným vlastníkom –
      vtedy sa výsledky nestratia ani po zatvorení appky a sú aj na inom zariadení. */
const MEM=new Map(); let lsOK=true;
try{localStorage.setItem('citanie__t','1');localStorage.removeItem('citanie__t')}catch(e){lsOK=false}
const LS={
  get(k){if(lsOK){try{const v=localStorage.getItem(k);if(v!==null)return v}catch(e){}}return MEM.has(k)?MEM.get(k):null},
  set(k,v,quiet){if(lsOK){try{localStorage.setItem(k,v)}catch(e){}}MEM.set(k,v);if(!quiet)touched()},
  remove(k){if(lsOK){try{localStorage.removeItem(k)}catch(e){}}MEM.delete(k);touched()},
  keys(){const out=new Set([...MEM.keys()]);if(lsOK){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k)out.add(k)}}catch(e){}}return[...out].filter(k=>k.startsWith('citanie_'))}
};
function touched(){LS.set('citanie__saved',String(Date.now()),true);cloudSave()}
let cloudRef=null, cloudBusy=false, cloudAgain=false, cloudTimer=null, cloudState='local';
const NO_SYNC=['citanie_voice','citanie_vok','citanie_vbad','citanie__saved','citanie__t'];
function snapshotLocal(){const keys={};LS.keys().forEach(k=>{if(!NO_SYNC.includes(k)){const v=LS.get(k);if(v!==null)keys[k]=v}});return{v:1,savedAt:+(LS.get('citanie__saved')||0),keys}}
function cloudSave(now){if(!cloudRef)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudWrite,now?0:2500)}
async function cloudWrite(){
  if(!cloudRef)return; if(cloudBusy){cloudAgain=true;return}
  cloudBusy=true;
  try{await cloudRef.set(snapshotLocal());cloudState='cloud'}
  catch(e){if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted'||e.code==='quota_exceeded')){cloudRef=null;cloudState='local'}}
  cloudBusy=false; updCloudNote();
  if(cloudAgain){cloudAgain=false;cloudWrite()}
}
async function initCloud(){
  try{
    if(!(window.claude&&typeof window.claude.use==='function'))return;
    const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id(); if(!uid)return;
    const ref=db.doc('data/users/'+uid+'/stav');
    const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),10000))]);
    const local=snapshotLocal(), remote=snap.exists?snap.data():null;
    cloudRef=ref;
    if(remote&&remote.keys&&(remote.savedAt||0)>local.savedAt){
      Object.entries(remote.keys).forEach(([k,v])=>LS.set(k,v,true));
      LS.set('citanie__saved',String(remote.savedAt),true);
      loadS();genCache.key='';applyFont();updStars();
      if(!main.querySelector('.prog')&&!main.querySelector('.pex')){if(store.get('onboarded',false)||S.stars>0)home();else welcome()}
      cloudState='cloud';
    }else if(!remote||local.savedAt>(remote.savedAt||0)){await cloudWrite()}
    else cloudState='cloud';
    updCloudNote();
  }catch(e){}
}

 Q:'kvé',R:'er',Ŕ:'dlhé er',S:'es',Š:'eš',T:'té',Ť:'ťé',U:'u',Ú:'dlhé ú',V:'vé',W:'dvojité vé',X:'iks',Y:'ypsilon',Ý:'dlhé ypsilon',Z:'zet',Ž:'žet'};
const VOWELS='AÁÄEÉIÍOÓÔUÚYÝ';
const isVowel=L=>VOWELS.includes(L);
const lname=L=>LETTER_NAME[L]||L.toLocaleLowerCase('sk');
function voiceScore(v){
  const l=(v.lang||'').toLowerCase().replace('_','-'), n=(v.name||'').toLowerCase();
  let s;
  if(l.startsWith('sk'))s=100; else return -1; // len slovenské hlasy
  if(/natural|neural|online|premium|enhanced|vylepš/.test(n))s+=20;
  if(/google/.test(n))s+=10;
  if(/laura|viktoria|lukas|filip/.test(n))s+=5;
  if(v.localService)s+=15; // stiahnutý v zariadení – nespadne na anglický hlas
  return s;
}
function pickVoice(){
  if(!hasTTS)return;
  const vs=speechSynthesis.getVoices();
  voiceList=vs.filter(v=>voiceScore(v)>=0).sort((a,b)=>voiceScore(b)-voiceScore(a));
  const saved=store.get('voice','');
  voice=voiceList.find(v=>v.name===saved)||voiceList[0]||null;
}
const hasSk=()=>!!(voice&&/^sk/i.test(voice.lang));
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=()=>{pickVoice();const vb=$('voiceBox');if(vb)vb.innerHTML=voiceBoxHTML()}}
function stopSpeak(){try{hasTTS&&speechSynthesis.cancel()}catch(e){}}
function say(text,rate){
  if(!S.sound||!hasTTS||!text)return;
  if(!voice)pickVoice();
  try{
    const busy=speechSynthesis.speaking||speechSynthesis.pending;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=voice?voice.lang:'sk-SK'; if(voice)u.voice=voice;
    u.rate=Math.max(0.5,(rate||0.9)*(S.slow?0.8:1)); u.pitch=1;
    // Chrome niekedy "zje" novú vetu hneď po zrušení starej – preto malá pauza
    if(busy)setTimeout(()=>speechSynthesis.speak(u),80); else speechSynthesis.speak(u);
  }catch(e){}
}

function voiceBoxHTML(){
  if(!hasTTS)return '<div class="note">Tento prehliadač nevie čítať nahlas. Hra funguje aj bez zvuku – slová mu prečítajte vy.</div>';
  const opts=voiceList.map(v=>`<option value="${esc(v.name)}" ${voice&&v.name===voice.name?'selected':''}>${esc(v.name)} (${esc(v.lang)})${v.localService?'':' ☁'}</option>`).join('');
  let h=voiceList.length?`<div class="row"><span>Hlas</span><select id="voiceSel">${opts}</select></div>`:'';
  return h;
}

/* ---------- Naše písmenká ---------- */
function syllabify(word){
  // jednoduché delenie na slabiky (na farebné slabiky pri vlastných slovách)
  const t=word, low=t.toLocaleLowerCase('sk'), V='aáäeéiíoóôuúyý', units=[];
  for(let i=0;i<low.length;i++){
    const two=low.slice(i,i+2);
    if(['ch','dz','dž','ia','ie','iu','au','ou'].includes(two)){units.push(t.slice(i,i+2));i++}else units.push(t[i]);
  }
  const isV=u=>V.includes(u.toLocaleLowerCase('sk')[0])&&!(u.length===2&&!V.includes(u.toLocaleLowerCase('sk')[1]));
  const vi=units.map((u,i)=>isV(u)?i:-1).filter(i=>i>=0);
  if(vi.length<2)return t;
  const cuts=[];
  for(let k=0;k<vi.length-1;k++){const gap=vi[k+1]-vi[k]-1;cuts.push(gap<=1?vi[k]+1:vi[k]+2)}
  let out='',prev=0;cuts.forEach(c=>{out+=units.slice(prev,c).join('')+'-';prev=c});
  return out+units.slice(prev).join('');
}

function genSentences(){
  const key=S.known.join('');
  if(genCache.key===key)return genCache.list;
  const out=new Set(), F=G_F.filter(canRead), M=G_M.filter(canRead), A=[...F,...M];
  const pres=G_PRES.filter(canRead), pastF=G_PAST.filter(p=>canRead(p[0])).map(p=>p[0]), pastM=G_PAST.filter(p=>canRead(p[1])).map(p=>p[1]), pl=G_PL.filter(canRead);
  const add=t=>{if(canRead(t)&&!/^Lev .*leva/.test(t))out.add(t)};
  A.forEach(x=>{pres.forEach(v=>add(cap(x)+' '+v+'.'))});
  F.forEach(x=>pastF.forEach(v=>add(cap(x)+' '+v+'.')));
  M.forEach(x=>pastM.forEach(v=>add(cap(x)+' '+v+'.')));

  genCache={key,list:[...out]};

function groupHTML(n,e,goneFrom){

function curBand(){const b=store.get('mband',null);if(b&&b.length===2)return b;return [0,S.mmax===10?10:5]}
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
// Príklad v danom rozsahu; výsledok aj prvé číslo ostanú v rozsahu
function genProblem(op,band,cross){
  const [lo,hi]=band, small=hi<=10;
  for(let t=0;t<300;t++){
    let a,b,r;
    if(op==='plus'){
      r=ri(Math.max(lo,1),hi);
      if(small){a=ri(Math.random()<.1?0:1,r);b=r-a;if((a===0||b===0)&&Math.random()<.8)continue}
      else{a=ri(lo>0?lo:1,r-1);b=r-a}
    }else{
      a=ri(Math.max(lo,1),hi);
      if(small){b=ri(Math.random()<.1?0:1,a);r=a-b}
      else{r=ri(lo,a-1);b=a-r}
    }
    if(!small&&!cross){ // bez prechodu cez desiatku
      if(op==='plus'&&(a%10)+(b%10)>10)continue;
      if(op==='minus'&&(a%10)<(b%10))continue;
    }
    return{a,b,r};
  }
  return op==='plus'?{a:lo,b:1,r:lo+1}:{a:hi,b:1,r:hi-1};
}

function today(d){const t=d||new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function getStats(){return store.get('stats',{})}
function track(keys,ok){
  if(!keys||!keys.length)return;
  const st=getStats();
  keys.forEach(k=>{const e=st[k]||[0,0];e[ok?0:1]++;st[k]=e});
  store.set('stats',st);
}
function logAct(){
  const a=store.get('act',{}), d=today(); a[d]=(a[d]||0)+1;
  const ks=Object.keys(a).sort(); while(ks.length>60)delete a[ks.shift()];
  store.set('act',a);
}
// váha úlohy: čo nejde, príde častejšie; nové trochu častejšie
function weight(keys){
  const st=getStats(); let w=1;
  (keys||[]).forEach(k=>{const e=st[k];
    if(!e){w=Math.max(w,1.4);return}
    const tot=e[0]+e[1], err=(e[1]+0.3)/(tot+1);
    w=Math.max(w,1+5*err*Math.min(1,tot/3));
  });
  return w;
}
function wqueue(list,keyFn){
  const recent=[];
  return()=>{
    const cand=list.filter(x=>!recent.includes(x)), pool=cand.length?cand:list;
    const ws=pool.map(x=>weight(keyFn(x)));
    let r=Math.random()*ws.reduce((a,b)=>a+b,0), pick=pool[pool.length-1];
    for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0){pick=pool[i];break}}
    recent.push(pick); if(recent.length>Math.min(4,Math.floor(list.length/2)))recent.shift();
    return pick;
  };
}
function streak(){
  const days=new Set(store.get('days',[])); let n=0; const d=new Date();
  if(!days.has(today(d)))d.setDate(d.getDate()-1);
  while(days.has(today(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}
const dailyDone=()=>store.get('days',[]).includes(today());
function markDaily(){const d=store.get('days',[]);if(!d.includes(today())){d.push(today());while(d.length>400)d.shift();store.set('days',d)}}

function storyMaker(){
  return()=>{
    const{A,P}=storyParts();
    let X,Y,pX,pY,t=0;
    do{[X,Y]=shuffle(A);[pX,pY]=shuffle(P);t++}
    while(t<60&&!(canRead(predTxt(pX,X.f))&&canRead(predTxt(pY,Y.f))&&predTxt(pX,true)!==predTxt(pY,true)&&!(X.n==='lev'&&pX[2]==='leva')&&!(Y.n==='lev'&&pY[2]==='leva')));
    const lines=[cap(X.n)+' '+predTxt(pX,X.f)+'.',cap(Y.n)+' '+predTxt(pY,Y.f)+'.'];
    // tretia veta – obaja spolu
    const pl=P.filter(p=>p!==pX&&p!==pY&&canRead(p[0].slice(0,-1)+'i'+(p[2]?' '+p[2]:'')));
    let pZ=null;
    if(pl.length&&Math.random()<.6){pZ=rand(pl);lines.push(cap(X.n)+' a '+Y.n+' '+pZ[0].slice(0,-1)+'i'+(pZ[2]?' '+pZ[2]:'')+'.')}
    const qs=[[X,pX,true],[Y,pY,true],[X,pY,false],[Y,pX,false]];
    if(pZ)qs.push([X,pZ,true],[Y,pZ,true]);
    const okq=qs.filter(([who,p])=>canRead(predTxt(p,who.f)));
    const[who,p,ans]=rand(okq);
    const verb=who.f?p[0]:p[1], qtxt=cap(verb)+' '+who.n+(p[2]?' '+p[2]:'')+'?';
    const all=lines.join(' ')+' '+qtxt;
    const shown=t=>S.upper&&!S.cursive?t.toLocaleUpperCase('sk'):t;
    return{label:'📚 Príbeh',
      prompt:`<div class="story">${lines.map(l=>`<div class="sentence sm">${shown(l).split(' ').map(w=>`<span class="w">${esc(w)}</span>`).join(' ')}</div>`).join('')}</div>
        <div class="question sentence sm">${shown(qtxt).split(' ').map(w=>`<span class="w">${esc(w)}</span>`).join(' ')}</div>
        <button class="sp" id="spk">🔊 Prečítaj mi</button>`,
      options:[{html:'✅<small>áno</small>',correct:ans},{html:'❌<small>nie</small>',correct:!ans}],optClass:'yn',
      ok:ans?'Áno':'Nie',track:['T:pribeh'],

  };
}

      return{label:'🕐 Hodiny',prompt:`<div class="q">Koľko je hodín?</div>${clockSVG(h,m)}`,optClass:'txt clk',

function clockSVG(h,m){
  const ha=((h%12)+m/60)*30*Math.PI/180, ma=m*6*Math.PI/180;
  let nums='';for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;nums+=`<text x="${100+Math.sin(a)*72}" y="${100-Math.cos(a)*72+8}" text-anchor="middle" font-size="22" font-weight="700" fill="#2B2D42">${i}</text>`}
  let tk='';for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r1=i%5?88:84;tk+=`<line x1="${100+Math.sin(a)*r1}" y1="${100-Math.cos(a)*r1}" x2="${100+Math.sin(a)*92}" y2="${100-Math.cos(a)*92}" stroke="#999" stroke-width="${i%5?1:3}"/>`}
  return`<svg viewBox="0 0 200 200" width="220" height="220" style="display:block;margin:6px auto"><circle cx="100" cy="100" r="96" fill="#fff" stroke="#2B2D42" stroke-width="6"/>${tk}${nums}
    <line x1="100" y1="100" x2="${100+Math.sin(ha)*48}" y2="${100-Math.cos(ha)*48}" stroke="#DC2626" stroke-width="9" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="${100+Math.sin(ma)*74}" y2="${100-Math.cos(ma)*74}" stroke="#1D4ED8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="7" fill="#2B2D42"/></svg><div class="muted">Krátka červená ručička = hodiny, dlhá modrá = minúty</div>`;
}
function moneyHTML(v){
  if(v<=2)return`<span class="coin ${v===2?'c2':''}">${v} €</span>`;
  const col={5:'#9ca3af',10:'#f87171',20:'#60a5fa',50:'#fb923c'}[v]||'#a3e635';
  return`<span class="bill" style="background:${col}">${v} €</span>`;
}

  ctx.fillText('v čítaní a počítaní',CW/2,990);
  ctx.font=`86px ${FONT}`;const b=Math.floor(S.stars/5);let em='';for(let i=Math.max(0,b-6);i<b;i++)em+=badge(i).e;ctx.fillText(em,CW/2,1170);
  ctx.font=`400 46px ${FONT}`;ctx.fillText(`${g('Si šikovný','Si šikovná')}! Len tak ďalej!`,CW/2,1300);
  ctx.font=`400 36px ${FONT}`;const d=new Date();ctx.fillText('Dátum: '+d.getDate()+'. '+(d.getMonth()+1)+'. '+d.getFullYear(),CW/2-280,1530);ctx.fillText('Podpis: ____________',CW/2+260,1530);
  ctx.font=`60px ${FONT}`;ctx.fillText('🦉',CW-190,CH-170);ctx.font=`400 28px ${FONT}`;ctx.fillText('Zvedavko',CW-190,CH-125);
  ctx.textAlign='left';
}
async function renderSheet(kind,opt){
  try{await Promise.all([document.fonts.load(`700 100px Andika`),document.fonts.load(`400 100px "Playwrite SK"`)])}catch(e){}
  const cv=document.createElement('canvas');cv.width=CW;cv.height=CH;const ctx=cv.getContext('2d');
  if(kind==='write')drawWrite(ctx,opt);else if(kind==='color')drawColor(ctx);else if(kind==='diploma')drawDiploma(ctx);else drawMath(ctx);
  return cv;
}
async function cardsView(kind,opt){
  const titles={write:'Písanie',color:'Maľovanie',math:'Počítanie',diploma:'Diplom'};
  setTitle('Karty: '+titles[kind]);
  opt=opt||(kind==='write'?'letters':'');
  main.innerHTML=`
    ${kind==='write'?(()=>{const cur=opt.startsWith('c'),m=cur?opt.slice(1):opt;return `<div class="tabs"><button class="tab ${m==='letters'?'on':''}" data-o="${cur?'c':''}letters">Písmenká</button><button class="tab ${m==='words'?'on':''}" data-o="${cur?'c':''}words">Slová</button></div>
      <div class="tabs"><button class="tab ${!cur?'on':''}" data-o="${m}">Tlačené</button><button class="tab ${cur?'on':''}" data-o="c${m}">✍️ Písané</button></div>`})():''}
    <div id="sheetBox" class="muted" style="text-align:center;padding:40px">Pripravujem kartu…</div>
    <div style="display:flex;gap:8px">
      <button class="big-btn alt" id="kNew" style="flex:1">${kind==='color'?'➡ Ďalší obrázok':kind==='diploma'?'🔄 Iná farba':'🔄 Iná karta'}</button>
      <button class="big-btn" id="kDl" style="flex:1">⬇ Stiahnuť</button>
    </div>
    <div class="muted" id="kMsg" style="text-align:center;margin-top:8px"></div>`;
  if(kind==='write')main.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>cardsView('write',b.dataset.o));
  const cv=await renderSheet(kind,opt);
  const url=cv.toDataURL('image/png');
  $('sheetBox').innerHTML=`<img class="sheet" src="${url}" alt="Karta na tlač">`;$('sheetBox').style.padding='0';
  $('kNew').onclick=()=>{if(kind==='color')colorIdx++;if(kind==='diploma')dipCol++;cardsView(kind,opt)};
  const names={diploma:'diplom',write:(opt.endsWith('words')?'obtahuj-slova':'obtahuj-pismenka')+(opt.startsWith('c')?'-pisane':''),color:'vymaluj',math:'pocitaj'};
  $('kDl').onclick=()=>{
    if(!dlApi){ // samostatný web (napr. GitHub Pages): bežné stiahnutie
      cv.toBlob(b=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=names[kind]+'.png';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}catch(e){}
        $('kMsg').innerHTML='Ak sa karta nestiahla, podržte prst na obrázku a zvoľte <b>Uložiť</b> alebo <b>Zdieľať → Tlačiť</b>.'},'image/png');
      return}
    cv.toBlob(async b=>{
      try{const r=await dlApi.save({filename:names[kind]+'.png',data:b});$('kMsg').textContent=r.status==='saved'?'Uložené ✔ Teraz ju môžete vytlačiť.':''}
      catch(e){$('kMsg').innerHTML=e&&e.code==='declined'?'':'Sťahovanie tu nejde – podržte prst na obrázku a zvoľte <b>Uložiť</b>.'}
    },'image/png');
  };
}

// posluchače nastavení – registrované iba raz
main.addEventListener('click',e=>{
  const id=e.target.id;
});
main.addEventListener('change',e=>{if(e.target.id==='voiceSel'){store.set('voice',e.target.value);pickVoice();say('Ahoj! Ideme čítať.')}});
applyFont();
updStars();
if(!store.get('onboarded',false)&&S.stars>0)store.set('onboarded',true);
if(store.get('onboarded',false))home();else welcome();
initCloud();
</script>
