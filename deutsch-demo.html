<style>
  :root{
    --bg:#FFF8EC; --ink:#2B2D42; --muted:#6b6f80;
    --yellow:#FFB703; --blue:#8ECAE6; --green:#90BE6D; --pink:#F28482; --purple:#B8A1E3;
    --s0:#1D4ED8; --s1:#DC2626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Andika",system-ui,sans-serif}
  button{font-family:inherit;color:inherit;cursor:pointer;border:none}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-bottom:2px solid #f1e6d2}
  header h1{flex:1;margin:0;font-size:20px;line-height:1.15}
  .hbtn{background:#fff;border-radius:14px;padding:8px 12px;font-size:20px;box-shadow:0 2px 0 #e6d9c2}
  .stars{background:#fff;border-radius:14px;padding:8px 12px;font-size:18px;font-weight:700;box-shadow:0 2px 0 #e6d9c2}
  main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
  .hello{font-size:30px;font-weight:700;margin:6px 0 16px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{border-radius:24px;padding:18px 10px;font-size:22px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 rgba(0,0,0,.12);transition:transform .1s}
  .card:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
  .card .big{font-size:48px}
  .card small{font-weight:400;font-size:14px;color:#3b3d50}
  .c1{background:var(--yellow)}.c2{background:var(--blue)}.c3{background:var(--green)}.c4{background:var(--pink)}
  .panel{background:#fff;border-radius:20px;padding:14px 16px;margin-top:18px;box-shadow:0 3px 0 #efe3cd}
  .panel h3{margin:0 0 8px;font-size:18px}
  .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px;margin-bottom:8px}
  .badge{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;text-align:center;line-height:1.15}
  .badge .b{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;
    background:radial-gradient(circle at 35% 30%,#fff6d0,#ffd34d 60%,#e8a800);border:4px solid #fff;box-shadow:0 0 0 3px #e8a800,0 4px 0 3px rgba(0,0,0,.12)}
  .badge.lock .b{background:#eee;box-shadow:0 0 0 3px #ddd;font-size:22px;filter:grayscale(1);opacity:.6}
  .badge.lock{color:#aaa}
  .muted{color:var(--muted);font-size:15px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #f3ead9}
  .row:first-of-type{border-top:none}
  .toggle{background:#eee;border-radius:999px;padding:8px 14px;font-size:16px;font-weight:700;min-width:92px}
  .toggle.on{background:var(--green)}
  input[type=text]{font-family:inherit;font-size:18px;padding:8px 12px;border-radius:12px;border:2px solid #e6d9c2;width:160px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{flex:1;background:#fff;border-radius:16px;padding:10px;font-size:18px;font-weight:700;box-shadow:0 3px 0 #e6d9c2}
  .tab.on{background:var(--yellow)}
  .show{background:#fff;border-radius:24px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;margin-bottom:14px;box-shadow:0 4px 0 #efe3cd;text-align:center}
  .lt{font-size:110px;line-height:1;font-weight:700}
  .lt small{font-size:70px;margin-left:10px;color:var(--s0)}
  .ex{font-size:34px;margin-top:8px}
  .ex b{color:var(--s1)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
  .key{background:#fff;border-radius:14px;padding:10px 0;font-size:28px;font-weight:700;box-shadow:0 3px 0 #e6d9c2}
  .key:active,.key.sel{background:var(--blue)}
  .sylgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
  .sylgrid .key{font-size:32px;padding:16px 0}
  .eq{font-size:56px;font-weight:700}
  .eq .c{color:var(--s0)} .eq .v{color:var(--s1)}
  .big-btn{display:block;width:100%;margin-top:14px;background:var(--green);border-radius:20px;padding:16px;font-size:22px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.12)}
  .big-btn.alt{background:var(--purple)}
  .levels{display:grid;gap:12px}
  .level{border-radius:20px;padding:16px;font-size:22px;font-weight:700;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.12);display:flex;align-items:center;gap:14px}
  .level span{font-size:15px;font-weight:400;display:block}
  .prog{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
  .prog i{width:14px;height:14px;border-radius:50%;background:#e9dcc4;display:block}
  .prog i.done{background:var(--green)} .prog i.now{background:var(--yellow);transform:scale(1.25)}
  .prompt{background:#fff;border-radius:24px;padding:22px 14px;text-align:center;box-shadow:0 4px 0 #efe3cd;margin-bottom:16px}
  .word{font-size:58px;font-weight:700;letter-spacing:2px;line-height:1.15;word-break:break-word}
  .syl.s0{color:var(--s0)} .syl.s1{color:var(--s1)}
  .dot{color:#bbb;margin:0 2px}
  .sentence{font-size:36px;font-weight:700;line-height:1.35}
  .sentence .w{display:inline-block;padding:0 4px;border-radius:10px;cursor:pointer}
  .sentence .w:active{background:#fde8a6}
  .sp{margin-top:14px;background:#FFF1CC;border-radius:999px;padding:10px 18px;font-size:18px;font-weight:700}
  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .opts.four{grid-template-columns:repeat(2,1fr)}
  .opt{background:#fff;border-radius:22px;padding:14px 0;font-size:60px;line-height:1.1;box-shadow:0 5px 0 #e6d9c2;transition:transform .1s}
  .opts.txt .opt{font-size:46px;font-weight:700}
  .opt:active{transform:translateY(3px)}
  .opt.ok{background:#c9f2b4;animation:pop .45s}
  .opt.bad{background:#ffd6d6;opacity:.55;animation:shake .4s}
  @keyframes pop{50%{transform:scale(1.15)}}
  @keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  .q{font-size:26px;font-weight:700}
  .reveal{margin-left:8px;background:#eee;border-radius:999px;padding:6px 12px;font-size:16px}
  .result{text-align:center;padding-top:20px}
  .trophy{font-size:110px;animation:pop 1s infinite}
  .result h2{font-size:32px;margin:10px 0 4px}
  .result p{font-size:22px;margin:6px 0}
  .newst{font-size:22px;font-weight:700;background:#fff;border-radius:20px;padding:14px;margin:14px 0;box-shadow:0 3px 0 #efe3cd;display:flex;flex-direction:column;align-items:center;gap:10px}
  .newst .badge{font-size:16px}
  .newst .badge .b{width:96px;height:96px;font-size:48px;animation:pop 1s infinite}
  .confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .confetti i{position:absolute;top:-50px;font-style:normal;font-size:30px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
  .wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:14px;text-align:left}
  .wide .big{font-size:44px}
  .c5{background:var(--purple)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{background:#f1ece2;border-radius:12px;padding:8px 0;min-width:48px;font-size:20px;font-weight:700}
  .chip.on{background:var(--green)}
  .big-btn small{font-weight:400;font-size:16px}
  .big-btn:disabled,.card:disabled,.level:disabled{opacity:.4}
  .slots{display:flex;justify-content:center;gap:8px;margin:14px 0 18px;flex-wrap:wrap}
  .slot{width:62px;height:76px;border-radius:16px;border:3px dashed #d9c9a8;background:#fff;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:700}
  .slot.f{border-style:solid;border-color:var(--green);animation:pop .35s}
  .slot.next{border-color:var(--yellow);background:#FFF8DD}
  .tiles{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
  .tile{width:70px;height:76px;border-radius:18px;background:var(--yellow);font-size:44px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.15)}
  .tile.used{visibility:hidden}
  .tile.bad{animation:shake .4s;background:#ffb4b4}
  .tmpl{font-size:44px;font-weight:700;letter-spacing:2px;opacity:.9}
  .pic{font-size:80px;line-height:1.1}
  .c6{background:#FFD6A5}
  .eqbig{font-size:clamp(40px,12vw,60px);font-weight:700;letter-spacing:2px;white-space:nowrap}
  .eqbig .qm{color:var(--s1)}
  .things{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;font-size:34px;margin-top:10px;line-height:1.15}
  .things .grp{display:grid;grid-template-columns:repeat(5,auto);gap:2px 4px;background:#FFF8EC;border-radius:14px;padding:6px 8px}
  .things .op{font-size:40px;font-weight:700;margin:0 6px}
  .things .gone{position:relative;display:inline-block}
  .things .gone i{font-style:normal;opacity:.3}
  .things .gone::after{content:'✖';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--s1);font-size:30px;font-weight:700}
  .cells{display:inline-flex;flex-direction:column;gap:3px;background:#FFF8EC;border-radius:10px;padding:6px;vertical-align:middle}
  .cells .ten{display:flex;gap:2px}
  .cells i{width:13px;height:13px;border-radius:3px;background:#3B82F6;display:block;position:relative}
  .cells i.o{background:#F59E0B}
  .cells i.x{background:#cbd5e1}
  .cells i.x::after{content:'';position:absolute;left:-1px;right:-1px;top:6px;height:2px;background:var(--s1);transform:rotate(-45deg)}
  .ansbox{margin:0 auto 12px;width:160px;height:80px;border-radius:18px;background:#fff;border:4px solid var(--yellow);font-size:52px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .ansbox.good{border-color:var(--green);background:#e8f8de}
  .ansbox.bad{animation:shake .4s;border-color:var(--s1)}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:360px;margin:0 auto}
  .kbtn{background:#fff;border-radius:18px;box-shadow:0 5px 0 #e6d9c2;font-size:36px;font-weight:700;padding:12px 0}
  .kbtn:active{transform:translateY(3px)}
  .keypad .okk{background:var(--green)}
  .opts.pad{grid-template-columns:repeat(6,1fr);gap:8px}
  .opts.pad .opt{font-size:34px;font-weight:700;padding:12px 0}
  .bar{height:16px;border-radius:999px;background:#eee;overflow:hidden;margin:10px 0 4px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),#ff9f1c);border-radius:999px}
  .sheet{width:100%;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.12);background:#fff;display:block}
  .vtest{background:#FFF8EC;border-radius:16px;padding:12px;margin-top:10px}
  textarea{width:100%;font-family:inherit;font-size:17px;padding:8px 10px;border-radius:12px;border:2px solid #e6d9c2;margin-top:6px;resize:vertical}
  .cur{font-family:"Playwrite SK",cursive;font-weight:400}
  .lt .curl{display:block;font-family:"Playwrite SK",cursive;font-weight:400;font-size:64px;color:#7c3aed;margin-top:14px;line-height:1.6}
  .curlbl{font-size:13px;color:var(--muted);font-weight:400;font-family:"Andika",sans-serif;margin-left:8px;vertical-align:middle}
  body.cursive .word,body.cursive .sentence,body.cursive .tmpl,body.cursive .tile,body.cursive .slot,body.cursive .opts.txt .opt,body.cursive .sylgrid .key,body.cursive .eq{font-family:"Playwrite SK",cursive;font-weight:400;letter-spacing:0}
  body.cursive .word{font-size:42px;line-height:1.7}
  body.cursive .sentence{font-size:28px;line-height:1.9}
  body.cursive .tile,body.cursive .slot{font-size:34px}
  .daily{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:24px;padding:14px 18px;margin-bottom:14px;font-size:20px;
    background:linear-gradient(135deg,#ffb703,#ff7b00);color:#2B2D42;box-shadow:0 5px 0 rgba(0,0,0,.15)}
  .daily small{font-size:15px;font-weight:400}
  .daily.done{background:linear-gradient(135deg,#b7e4a0,#90BE6D)}
  .owlbox{display:flex;align-items:flex-end;gap:8px;margin:-6px 0 14px}
  .owlbox .o{font-size:46px;line-height:1;width:72px;flex:none}
  .owlbox .bub{background:#fff;border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:16px;box-shadow:0 3px 0 #efe3cd;flex:1}



  /* --- Inštalácia na plochu --- */
  .ins-bar{display:flex;gap:6px;margin-bottom:10px}
  .ins-bar #instGo{flex:1;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;border-radius:16px;padding:10px 14px;text-align:left;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
  .ins-bar #instGo small{display:block;font-size:13px;opacity:.9;font-weight:600}
  .ins-bar #instX{background:#eee;border-radius:14px;width:44px;font-size:18px}
  .ins-steps{line-height:1.6;font-size:18px;padding-left:24px;margin:14px 0}.ins-steps li{margin-bottom:12px}
  .ins-ico{display:inline-flex;vertical-align:middle;background:#f2f2f7;border-radius:8px;padding:3px;margin:0 2px}
  .ins-safari{background:#eef4ff;border-radius:14px;padding:10px 12px;margin-top:10px;font-size:15px;line-height:1.5}.ins-safari ol{padding-left:20px;margin:6px 0 0}
  /* --- Vesmírna sovička --- */
  .sg-tile{background:linear-gradient(135deg,#1b1f4b,#5a2a82);color:#fff}.sg-tile span span,.sg-tile div span{color:#d6c8ff}
  .sg-intro .sg-hero{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#1b1f4b,#5a2a82);color:#fff;border-radius:20px;padding:12px 14px;margin-bottom:12px}
  .sg-hero span{color:#e2d9ff;font-size:15px}.sg-hero b{font-size:22px}
  .sg{position:relative;border-radius:20px;overflow:hidden;background:#0b1026;touch-action:none;-webkit-user-select:none;user-select:none;margin:-4px -4px 0}
  .sg canvas{display:block;touch-action:none}
  .sg-hud{position:absolute;left:0;right:0;top:0;pointer-events:none;padding:8px 10px}
  .sg-top{display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:17px}
  .sg-top .sg-sc{margin-left:auto;font-size:22px;color:#ffd166;text-shadow:0 2px 0 rgba(0,0,0,.4)}
  .sg-top .sg-lv{font-size:14px;color:#cfd8ff}
  .sg-top button{pointer-events:auto;background:rgba(255,255,255,.15);color:#fff;border-radius:12px;padding:6px 10px;font-size:18px}
  .sg-task{margin:8px auto 0;display:flex;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.12);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:2px solid rgba(255,255,255,.18);border-radius:18px;padding:6px 16px;width:max-content;max-width:94%;color:#fff}
  .sg-task.pop{animation:sgPop .35s ease-out}
  @keyframes sgPop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  .sg-q{font-size:32px;font-weight:800;letter-spacing:.5px}.sg-emo{font-size:46px;line-height:1}.sg-task .sg-emo+.sg-q{font-size:18px;font-weight:700}
  .sg-msg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.8);opacity:0;color:#fff;font-size:26px;font-weight:800;text-align:center;text-shadow:0 3px 0 rgba(0,0,0,.45);pointer-events:none;width:90%;transition:.25s}
  .sg-msg.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .sg-over{position:absolute;inset:0;background:rgba(5,8,25,.72);display:flex;align-items:center;justify-content:center;padding:16px}
  .sg-over[hidden]{display:none}
  .sg-card{background:#fff;border-radius:22px;padding:18px;text-align:center;width:100%;max-width:340px;animation:sgPop .4s ease-out}
  .sg-card h2{margin:4px 0}.sg-big{font-size:54px;font-weight:800;color:#5a2a82;line-height:1.1}
  /* --- Pohyblivá sovička Zvedavko --- */
  .ow{display:block;overflow:visible;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .ow .all{animation:owBob 2.8s ease-in-out infinite;transform-origin:60px 112px}
  @keyframes owBob{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-3px) scaleY(1.02)}}
  .ow .head{transform-origin:60px 52px}
  .ow .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:owBlink 4.6s infinite}
  .ow .lid.r{animation-delay:.03s}
  @keyframes owBlink{0%,90%,100%{transform:scaleY(0)}93%,96%{transform:scaleY(1)}}
  .ow .pup{animation:owLook 8s ease-in-out infinite}
  @keyframes owLook{0%,35%,100%{transform:translate(0,0)}40%,52%{transform:translate(3px,1px)}58%,70%{transform:translate(-3px,0)}}
  .ow .wl{transform-box:fill-box;transform-origin:85% 10%}
  .ow .wr{transform-box:fill-box;transform-origin:15% 10%}
  .ow .bk2{transform-box:fill-box;transform-origin:50% 0}
  .ow.happy .all{animation:owHop .45s ease-out 2}
  .ow.happy .wl{animation:owFlapL .18s ease-in-out 6 alternate}
  .ow.happy .wr{animation:owFlapR .18s ease-in-out 6 alternate}
  @keyframes owHop{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(2px) scale(1.06,.94)}55%{transform:translateY(-14px) scale(.96,1.05)}}
  @keyframes owFlapL{to{transform:rotate(35deg)}}
  @keyframes owFlapR{to{transform:rotate(-35deg)}}
  .ow.oops .head{animation:owTilt 1.1s ease-in-out}
  @keyframes owTilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}55%{transform:rotate(9deg)}80%{transform:rotate(-4deg)}}
  .ow.wave .wr{animation:owWave .3s ease-in-out 4 alternate}
  @keyframes owWave{from{transform:rotate(-20deg)}to{transform:rotate(-75deg)}}

const MEM=new Map(); let lsOK=true;
try{localStorage.setItem('zvdedemo__t','1');localStorage.removeItem('zvdedemo__t')}catch(e){lsOK=false}
const LS={
  get(k){if(lsOK){try{const v=localStorage.getItem(k);if(v!==null)return v}catch(e){}}return MEM.has(k)?MEM.get(k):null},
  set(k,v,quiet){if(lsOK){try{localStorage.setItem(k,v)}catch(e){}}MEM.set(k,v);if(!quiet)touched()},
  remove(k){if(lsOK){try{localStorage.removeItem(k)}catch(e){}}MEM.delete(k);touched()},
  keys(){const out=new Set([...MEM.keys()]);if(lsOK){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k)out.add(k)}}catch(e){}}return[...out].filter(k=>k.startsWith('zvdedemo_'))}
};
function touched(){LS.set('zvdedemo__saved',String(Date.now()),true);0}
let cloudRef=null, cloudBusy=false, cloudAgain=false, cloudTimer=null, cloudState='local';
const NO_SYNC=['zvdedemo_voice','zvdedemo_vok','zvdedemo_vbad','zvdedemo__saved','zvdedemo__t','zvdedemo_cur','zvdedemo__synced','zvdedemo__insthide'];
function snapshotLocal(){const keys={};LS.keys().forEach(k=>{if(!NO_SYNC.includes(k)){const v=LS.get(k);if(v!==null)keys[k]=v}});return{v:1,savedAt:+(LS.get('zvdedemo__saved')||0),keys}}
function cloudSave(now){if(!cloudRef)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudWrite,now?0:(cloudRef.slowSave?45000:2500))}
async function cloudWrite(){
  if(!cloudRef)return; if(cloudBusy){cloudAgain=true;return}
  cloudBusy=true;
  try{const snap=snapshotLocal();await cloudRef.set(snap);LS.set('zvdedemo__synced',String(snap.savedAt),true);cloudState='cloud'}
  catch(e){if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted'||e.code==='quota_exceeded')){cloudRef=null;cloudState='local'}}
  cloudBusy=false; updCloudNote();
  if(cloudAgain){cloudAgain=false;cloudWrite()}
}
async function initCloud(preferRemote){
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      const uid=db&&user?await user.id():null;
      if(uid)return cloudConnect(db.doc('data/users/'+uid+'/stav'));
    }
    if(typeof codeCloud==='function'){const r=codeCloud();if(r)return cloudConnect(r,preferRemote)}
  }catch(e){}
}
async function cloudConnect(ref,preferRemote){
  try{
    const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),10000))]);
    const local=snapshotLocal(), remote=snap.exists?snap.data():null;
    cloudRef=ref;
    // „synced“ = verzia zo servera, s ktorou bolo toto zariadenie naposledy zosúladené
    const synced=+(LS.get('zvdedemo__synced')||0);
    const remoteNewer=remote&&remote.keys&&(preferRemote||(remote.savedAt||0)>(synced||local.savedAt));
    if(remoteNewer){
      Object.entries(remote.keys).forEach(([k,v])=>LS.set(k,v,true));
      LS.set('zvdedemo__saved',String(remote.savedAt),true);LS.set('zvdedemo__synced',String(remote.savedAt),true);
      loadS();genCache.key='';applyFont();updStars();
      if(!main.querySelector('.prog')&&!main.querySelector('.pex')){if(store.get('onboarded',false)||S.stars>0)home();else welcome()}
      cloudState='cloud';
    }else if(!remote||local.savedAt>(remote.savedAt||0)||local.savedAt>synced){await cloudWrite()}
    else cloudState='cloud';
    updCloudNote();
  }catch(e){}
}

function idb(){return new Promise((res,rej)=>{
  if(recDB)return res(recDB); if(!window.indexedDB)return rej('noidb');
  const r=indexedDB.open('zvedavko_hlas',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('rec');
  r.onsuccess=()=>{recDB=r.result;res(recDB)}; r.onerror=()=>rej(r.error);
})}
function idbDo(mode,fn){return idb().then(db=>new Promise((res,rej)=>{
  const tx=db.transaction('rec',mode), req=fn(tx.objectStore('rec'));
  tx.oncomplete=()=>res(req&&req.result); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error);
}))}
const recGet=k=>idbDo('readonly',st=>st.get(k));
const recPut=(k,blob)=>idbDo('readwrite',st=>st.put(blob,k)).then(()=>{REC.add(k);bufCache.delete('r:'+k)});
const recDel=k=>idbDo('readwrite',st=>st.delete(k)).then(()=>{REC.delete(k);bufCache.delete('r:'+k)});
idbDo('readonly',st=>st.getAllKeys()).then(ks=>(ks||[]).forEach(k=>REC.add(k))).catch(()=>{});
// Nahrávku dekóduje, oreže ticho na začiatku a na konci a zjednotí hlasitosť
async function recBuffer(k){
  const own=ownClip(k), ck=(own?'r:':'p:')+k;
  if(bufCache.has(ck))return bufCache.get(ck);
  const ac=audio(); if(!ac)return null;
  let ab;
  if(own){const blob=await recGet(k); if(!blob)return null; ab=await new Response(blob).arrayBuffer()}
  else if(DEMO||OPEN){const b64=vpack()[k]; if(!b64)return null; ab=b64bytes(b64).buffer}
  else{const ix=vpack()[k]; if(!ix||!PACKBIN)return null; ab=PACKBIN.slice(ix[0],ix[0]+ix[1]).buffer}
  const buf=await new Promise((res,rej)=>ac.decodeAudioData(ab,res,rej));
  const d=buf.getChannelData(0); let peak=0;
  for(let i=0;i<d.length;i++){const v=Math.abs(d[i]);if(v>peak)peak=v}
  const th=Math.max(0.015,peak*0.07); let a=0,b=d.length-1;
  while(a<d.length&&Math.abs(d[a])<th)a++; while(b>a&&Math.abs(d[b])<th)b--;
  const sr=buf.sampleRate; let st=Math.max(0,a/sr-0.05), en=Math.min(buf.duration,b/sr+0.15);
  if(en-st<0.15){st=0;en=buf.duration}
  const o={buf,st,en,a:a/sr,b:b/sr,gain:peak>0.001?Math.min(5,0.85/peak):1};
  bufCache.set(ck,o); return o;
}
function playBuf(o,tok){return new Promise(res=>{
  const ac=audio(); if(!ac||tok!==spkTok)return res();
  try{const src=ac.createBufferSource(), g=ac.createGain();
    src.buffer=o.buf; g.gain.value=o.gain; src.connect(g); g.connect(ac.destination);
    let fin=false; const end=()=>{if(fin)return;fin=true;if(curSrc===src)curSrc=null;res()};
    src.onended=end; curSrc=src;
    const len=Math.max(0.05,o.en-o.st); src.start(0,o.st,len); setTimeout(end,len*1000+600);
  }catch(e){res()}
})}
// Viac nahrávok za sebou (slová vo vete) – tesne naviazané, s jemným prelínaním, bez medzier
function playChain(os,tok){return new Promise(res=>{
  const ac=audio(); if(!ac||tok!==spkTok)return res();
  let t=ac.currentTime+0.03; const srcs=[];
  try{os.forEach((o,i)=>{
    const a=Math.max(0,o.a-0.02), b=Math.min(o.buf.duration,o.b+(i===os.length-1?0.15:0.05)), len=b-a;
    const src=ac.createBufferSource(), g=ac.createGain(); src.buffer=o.buf;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(o.gain,t+0.015);
    g.gain.setValueAtTime(o.gain,Math.max(t+0.02,t+len-0.03)); g.gain.linearRampToValueAtTime(0,t+len);
    src.connect(g); g.connect(ac.destination); src.start(t,a,len); srcs.push(src);
    t+=len-0.015;
  })}catch(e){return res()}
  curSrcs=srcs; const ms=(t-ac.currentTime)*1000+40;
  const end=Date.now()+ms, tick=()=>{if(tok!==spkTok||Date.now()>=end)return res();setTimeout(tick,50)};tick();
})}

let micStream=null, mrec=null, mchunks=[];
async function micStart(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder)throw new Error('nomic');
  if(!micStream)micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  const type=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
  mrec=new MediaRecorder(micStream,type?{mimeType:type}:undefined); mchunks=[];
  mrec.ondataavailable=e=>{if(e.data&&e.data.size)mchunks.push(e.data)};
  mrec.start();
}
function micStop(){return new Promise(res=>{
  if(!mrec||mrec.state==='inactive')return res(null);
  mrec.onstop=()=>res(new Blob(mchunks,{type:mrec.mimeType||'audio/mp4'})); mrec.stop();
})}
function micClose(){try{if(mrec&&mrec.state!=='inactive')mrec.stop()}catch(e){}try{micStream&&micStream.getTracks().forEach(t=>t.stop())}catch(e){}micStream=null;mrec=null}

  const ph=['Výborne','Super','Paráda',g('Si šikovný','Si šikovná'),'Skvelé','Presne tak','Úžasné','Tak je to','Dobre','Dobrá práca','Skús ešte raz','Skús iné písmenko','Áno','Nie'];

function sylFindMaker(){
  const pool=sylPool(), next=wqueue(pool,x=>['S:'+x]);
  return()=>{
    const t=next(), V=S.known.filter(isVowel), C=S.known.filter(l=>!isVowel(l));
    const c=t.slice(0,t.length-1), v=t.slice(-1);
    const opts=new Set([t]);
    if(c.length===1&&c!==v)opts.add(v+c);                 // obrátená: AL
    shuffle(V).forEach(x=>{if(opts.size<4&&x!==v)opts.add(c+x)});   // LE, LI
    shuffle(C).forEach(x=>{if(opts.size<4&&x!==c)opts.add(x+v)});   // MA

      optClass:'txt four',options:shuffle([...opts]).map(o=>({html:esc(cs(o)),correct:o===t})),ok:'',track:['S:'+t]};
  };
}

function sylMaker(){

  return()=>{
    const t=next(), c=t.slice(0,-1), v=t.slice(-1);
    const near=pool.filter(x=>x!==t&&(x.startsWith(c)||x.endsWith(v)));

}

/* ---------- Naše písmenká ---------- */
function syllabify(word){
  // jednoduché delenie na slabiky (na farebné slabiky pri vlastných slovách)
  const t=word, low=t.toLocaleLowerCase('sk'), V='aáäeéiíoóôuúyý', units=[];
  for(let i=0;i<low.length;i++){
    const two=low.slice(i,i+2);
    if(['ch','dz','dž','ia','ie','iu','au','ou'].includes(two)){units.push(t.slice(i,i+2));i++}else units.push(t[i]);
  }
  const isV=u=>V.includes(u.toLocaleLowerCase('sk')[0])&&!(u.length===2&&!V.includes(u.toLocaleLowerCase('sk')[1]));
  const vi=units.map((u,i)=>isV(u)?i:-1).filter(i=>i>=0);
  if(vi.length<2)return t;
  const cuts=[];
  for(let k=0;k<vi.length-1;k++){const gap=vi[k+1]-vi[k]-1;cuts.push(gap<=1?vi[k]+1:vi[k]+2)}
  let out='',prev=0;cuts.forEach(c=>{out+=units.slice(prev,c).join('')+'-';prev=c});
  return out+units.slice(prev).join('');
}

function buildPool(){ // bežné slová (nie mená), ktoré vie prečítať

const SYL_C=new Set(['B','C','Č','D','Ď','DŽ','F','G','H','CH','J','K','L','Ľ','M','N','Ň','P','R','S','Š','T','Ť','V','Z','Ž']);
const SYL_V=new Set(['A','Á','E','I','Í','O','U','Ú','Y','Ý']);
const SYL_SOFT=new Set(['C','Č','Ď','DŽ','J','Ľ','Ň','Š','Ť','Ž']);
function sylOk(c,v){
  if(!SYL_C.has(c)||!SYL_V.has(v))return false;
  if(SYL_SOFT.has(c)&&(v==='Y'||v==='Ý'))return false;
  if(['Ď','Ľ','Ň','Ť'].includes(c)&&['E','I','Í'].includes(v))return false;
  return true;
}
function sylPool(){
  const V=S.known.filter(isVowel), C=S.known.filter(l=>!isVowel(l));
  const out=[];C.forEach(c=>V.forEach(v=>{if(sylOk(c,v))out.push(c+v)}));return out;
}

        <div class="tiles">${tiles.map((l,i)=>`<button class="tile" data-t="${i}">${esc(cs(l))}</button>`).join('')}</div>`;
      let pos=0, mistakes=0;

// Príklad v danom rozsahu; výsledok aj prvé číslo ostanú v rozsahu
function genProblem(op,band,cross){
  const [lo,hi]=band, small=hi<=10;
  for(let t=0;t<300;t++){
    let a,b,r;
    if(op==='plus'){
      r=ri(Math.max(lo,1),hi);
      if(small){a=ri(Math.random()<.1?0:1,r);b=r-a;if((a===0||b===0)&&Math.random()<.8)continue}
      else{a=ri(lo>0?lo:1,r-1);b=r-a}
    }else{
      a=ri(Math.max(lo,1),hi);
      if(small){b=ri(Math.random()<.1?0:1,a);r=a-b}
      else{r=ri(lo,a-1);b=a-r}
    }
    if(!small&&!cross){ // bez prechodu cez desiatku
      if(op==='plus'&&(a%10)+(b%10)>10)continue;
      if(op==='minus'&&(a%10)<(b%10))continue;
    }
    return{a,b,r};
  }
  return op==='plus'?{a:lo,b:1,r:lo+1}:{a:hi,b:1,r:hi-1};
}

function today(d){const t=d||new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}

  store.set('stats',st);
}
function logAct(){
  const a=store.get('act',{}), d=today(); a[d]=(a[d]||0)+1;
  const ks=Object.keys(a).sort(); while(ks.length>60)delete a[ks.shift()];
  store.set('act',a);

// váha úlohy: čo nejde, príde častejšie; nové trochu častejšie
function weight(keys){
  const st=getStats(); let w=1;
  (keys||[]).forEach(k=>{const e=st[k];
    if(!e){w=Math.max(w,1.4);return}
    const tot=e[0]+e[1], err=(e[1]+0.3)/(tot+1);
    w=Math.max(w,1+5*err*Math.min(1,tot/3));
  });
  return w;
}
function wqueue(list,keyFn){
  const recent=[];
  return()=>{
    const cand=list.filter(x=>!recent.includes(x)), pool=cand.length?cand:list;
    const ws=pool.map(x=>weight(keyFn(x)));
    let r=Math.random()*ws.reduce((a,b)=>a+b,0), pick=pool[pool.length-1];
    for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0){pick=pool[i];break}}
    recent.push(pick); if(recent.length>Math.min(4,Math.floor(list.length/2)))recent.shift();
    return pick;
  };
}
function streak(){
  const days=new Set(store.get('days',[])); let n=0; const d=new Date();
  if(!days.has(today(d)))d.setDate(d.getDate()-1);
  while(days.has(today(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}

function letterReadiness(){

    const n=e[0]+e[1]; ok+=e[0]; tot+=n; if(n<5||e[0]/n<0.85)ready=false});
  return{ready:ready&&tot>=40,pct:tot?Math.round(ok/tot*100):0,tot};

    for(const r of G.rocks){
      cx.save();cx.translate(r.x,r.y);cx.save();cx.rotate(r.rot);
      cx.fillStyle=r.c;cx.beginPath();r.shape.forEach(([x,y],i)=>i?cx.lineTo(x,y):cx.moveTo(x,y));cx.closePath();cx.fill();
      cx.strokeStyle='rgba(0,0,0,.25)';cx.lineWidth=3;cx.stroke();
      cx.fillStyle='rgba(0,0,0,.18)';[[-.35,-.3,.18],[.3,.25,.14],[.25,-.4,.1]].forEach(([a,b,c])=>{cx.beginPath();cx.arc(a*r.r,b*r.r,c*r.r,0,7);cx.fill()});
      cx.restore();
      cx.font='800 '+(r.label.length>6?22:26)+'px Andika, system-ui, sans-serif';cx.lineWidth=5;cx.strokeStyle='rgba(0,0,0,.55)';cx.strokeText(r.label,0,1);cx.fillStyle='#fff';cx.fillText(r.label,0,1);
      cx.restore();
    }
    // predmety
    for(const it of G.items){cx.font='34px system-ui';cx.fillText(it.kind==='heart'?'💖':it.kind==='slow'?'⏳':'⭐',it.x,it.y)}
    // lasery
    const ox=G.owlX*W, oy=H-48;
    for(const l of G.lasers){cx.strokeStyle=`rgba(120,255,214,${l.life*5})`;cx.lineWidth=6;cx.beginPath();cx.moveTo(ox,oy-30);cx.lineTo(l.x,l.y);cx.stroke();cx.strokeStyle=`rgba(255,255,255,${l.life*5})`;cx.lineWidth=2;cx.stroke()}
    // sovička s raketovým plameňom
    const bob=Math.sin(G.t*4)*3;
    cx.fillStyle='#ff9f1c';cx.beginPath();cx.moveTo(ox-12,oy+22+bob);cx.lineTo(ox+12,oy+22+bob);cx.lineTo(ox,oy+40+Math.random()*14+bob);cx.closePath();cx.fill();
    cx.fillStyle='#ffd166';cx.beginPath();cx.moveTo(ox-6,oy+22+bob);cx.lineTo(ox+6,oy+22+bob);cx.lineTo(ox,oy+32+Math.random()*8+bob);cx.closePath();cx.fill();
    if(owlImg.complete)cx.drawImage(owlImg,ox-34,oy-40+bob,68,70);
    // čiastočky a texty
    for(const p of G.parts){cx.globalAlpha=Math.max(0,p.life/p.max);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s)}cx.globalAlpha=1;
    for(const t of G.texts){cx.globalAlpha=Math.max(0,t.life);cx.font='800 26px Andika, system-ui, sans-serif';cx.lineWidth=4;cx.strokeStyle='rgba(0,0,0,.5)';cx.strokeText(t.t,t.x,t.y);cx.fillStyle=t.c;cx.fillText(t.t,t.x,t.y)}cx.globalAlpha=1;
    // čiara dna
    cx.strokeStyle='rgba(255,255,255,.12)';cx.setLineDash([6,8]);cx.beginPath();cx.moveTo(0,H-70);cx.lineTo(W,H-70);cx.stroke();cx.setLineDash([]);
    if(G.slow>0){cx.fillStyle='rgba(160,231,255,.9)';cx.font='700 16px system-ui';cx.fillText('⏳ '+Math.ceil(G.slow),W-36,H-20)}
    cx.restore();
  }
  hud(); msg('3… 2… 1… štart! 🚀',1400); setTimeout(newTask,1400);
  requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)});
}

function enParse(s){const m=String(s).match(/^(der|die|das) (.+)$/);return m?{art:m[1],bare:m[2]}:{art:'',bare:s}}
const enItem=(w,t)=>({en:w[0],sk:w[1],e:w[2],num:!!t.num,phr:!!t.phr,t:t.id,...enParse(w[0])});

const enKey=t=>'en:'+String(t).toLowerCase().replace(/[’]/g,"'").replace(/[^a-zäöüß' ]/g,' ').replace(/\s+/g,' ').trim();
let enVoiceTTS=null;
function enTTS(text,rate,tok){return new Promise(res=>{
  if(!hasTTS||tok!==spkTok)return res();
  try{
    if(!enVoiceTTS){const vs=speechSynthesis.getVoices();enVoiceTTS=vs.find(v=>v.lang.replace('_','-').toLowerCase()===LG.tts.toLowerCase())||vs.find(v=>v.lang.toLowerCase().startsWith(LANG))||null}
    const u=new SpeechSynthesisUtterance(text); u.lang=LG.tts; if(enVoiceTTS)u.voice=enVoiceTTS;
    u.rate=Math.max(0.6,(rate||0.85)*(S.slow?0.85:1)); let fin=false; const f=()=>{if(!fin){fin=true;res()}};
    u.onend=f;u.onerror=f;speechSynthesis.speak(u);setTimeout(f,1500+String(text).length*130);
  }catch(e){res()}
})}
// anglický hlas (nahratý rodený hovorca, inak hlas telefónu po anglicky)
function sayEn(text,rate){
  if(!S.sound||!text)return Promise.resolve();
  stopSpeak(); const tok=spkTok, k=enKey(text); setTalking(true);
  return(async()=>{
    let buf=null; try{if(vpack()[k])buf=await recBuffer(k)}catch(e){}
    if(tok!==spkTok)return;
    if(buf&&await audioReady())await playBuf(buf,tok); else await enTTS(text,rate,tok);
    if(tok===spkTok)setTalking(false);
  })();
}

function enPool(o={}){
  const tid=store.get('en_topic')||'all';
  let ts=enTopics().filter(t=>!enLocked(t));
  if(tid!=='all'){const t=ts.find(t=>t.id===tid); if(t)ts=[t]}
  if(o.noPhr&&ts.some(t=>!t.phr))ts=ts.filter(t=>!t.phr);
  const out=[]; ts.forEach(t=>t.w.forEach(w=>out.push(enItem(w,t))));
  return out;
}

      custom:(box,done)=>{

        let pos=0, miss=0;

          <div class="tiles">${shuffle([...ls,...extra]).map((c,i)=>`<button class="tile en ${LANG}" data-c="${c}" data-i="${i}">${c}</button>`).join('')}</div>`;
        box.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{

        :`${who} ${G('mal','mala')} ${p.a} ${nounForm(nn,p.a)}. Potom ${G('rozdal','rozdala')} ${p.b} ${nounForm(nn,p.b)}. Koľko ${nn[2]} ${G('mu','jej')} zostalo?`;

        :`${who} ${G('mal','mala')} ${nw(p.a)} ${nounForm(nn,p.a)}. Potom ${G('rozdal','rozdala')} ${nw(p.b)} ${nounForm(nn,p.b)}. Koľko ${nn[2]} ${G('mu','jej')} zostalo?`;

function clockSVG(h,m){
  const ha=((h%12)+m/60)*30*Math.PI/180, ma=m*6*Math.PI/180;
  let nums='';for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;nums+=`<text x="${100+Math.sin(a)*72}" y="${100-Math.cos(a)*72+8}" text-anchor="middle" font-size="22" font-weight="700" fill="#2B2D42">${i}</text>`}
  let tk='';for(let i=0;i<60;i++){const a=i*6*Math.PI/180,r1=i%5?88:84;tk+=`<line x1="${100+Math.sin(a)*r1}" y1="${100-Math.cos(a)*r1}" x2="${100+Math.sin(a)*92}" y2="${100-Math.cos(a)*92}" stroke="#999" stroke-width="${i%5?1:3}"/>`}
  return`<svg viewBox="0 0 200 200" width="220" height="220" style="display:block;margin:6px auto"><circle cx="100" cy="100" r="96" fill="#fff" stroke="#2B2D42" stroke-width="6"/>${tk}${nums}
    <line x1="100" y1="100" x2="${100+Math.sin(ha)*48}" y2="${100-Math.cos(ha)*48}" stroke="#DC2626" stroke-width="9" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="${100+Math.sin(ma)*74}" y2="${100-Math.cos(ma)*74}" stroke="#1D4ED8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="7" fill="#2B2D42"/></svg><div class="muted">Krátka červená ručička = hodiny, dlhá modrá = minúty</div>`;
}
function moneyHTML(v){
  if(v<=2)return`<span class="coin ${v===2?'c2':''}">${v} €</span>`;
  const col={5:'#9ca3af',10:'#f87171',20:'#60a5fa',50:'#fb923c'}[v]||'#a3e635';
  return`<span class="bill" style="background:${col}">${v} €</span>`;
}

/* ---------- Tvary a telesá ---------- */
const SH2=['kruh','štvorec','obdĺžnik','trojuholník'], SH3=['kocka','guľa','valec','kužeľ','kváder'];
const SH_ACC={kocka:'kocku',guľa:'guľu'};                     // Nájdi kocku…
const SH_GEN={kruh:'kruhov',štvorec:'štvorcov',obdĺžnik:'obdĺžnikov',trojuholník:'trojuholníkov'}; // Koľko je tu kruhov?
const SH_COL=['#ef4444','#3b82f6','#facc15','#22c55e','#a855f7','#fb923c'];
function shapeEl(t,cx,cy,s,col,rot){
  const st=`fill="${col}" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"`, R=`transform="rotate(${rot||0} ${cx} ${cy})"`, dk='fill="#000" fill-opacity=".18" stroke="#1f2937" stroke-width="3" stroke-linejoin="round"';
  if(t==='kruh')return`<circle cx="${cx}" cy="${cy}" r="${s/2}" ${st}/>`;
  if(t==='štvorec')return`<rect x="${cx-s/2}" y="${cy-s/2}" width="${s}" height="${s}" ${st} ${R}/>`;
  if(t==='obdĺžnik')return`<rect x="${cx-s*.72}" y="${cy-s*.36}" width="${s*1.44}" height="${s*.72}" ${st} ${R}/>`;
  if(t==='trojuholník'){const h=s*.9;return`<polygon points="${cx},${cy-h/2} ${cx+s*.55},${cy+h/2} ${cx-s*.55},${cy+h/2}" ${st} ${R}/>`}
  if(t==='guľa')return`<circle cx="${cx}" cy="${cy}" r="${s/2}" ${st}/><ellipse cx="${cx}" cy="${cy}" rx="${s/2}" ry="${s/7}" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="5 5"/><circle cx="${cx-s*.17}" cy="${cy-s*.18}" r="${s*.08}" fill="#fff" opacity=".7"/>`;
  if(t==='kocka'||t==='kváder'){
    const w=t==='kocka'?s*.66:s*1.0, h=t==='kocka'?s*.66:s*.5, d=s*.3, x=cx-(w+d)/2, y=cy-(h-d)/2;
    return`<rect x="${x}" y="${y}" width="${w}" height="${h}" ${st}/><polygon points="${x},${y} ${x+d},${y-d} ${x+w+d},${y-d} ${x+w},${y}" ${st}/><polygon points="${x},${y} ${x+d},${y-d} ${x+w+d},${y-d} ${x+w},${y}" fill="#fff" fill-opacity=".35" stroke="none"/>
      <polygon points="${x+w},${y} ${x+w+d},${y-d} ${x+w+d},${y+h-d} ${x+w},${y+h}" ${st}/><polygon points="${x+w},${y} ${x+w+d},${y-d} ${x+w+d},${y+h-d} ${x+w},${y+h}" ${dk}/>`;
  }
  if(t==='valec'){const w=s*.7,h=s*.8,ry=w/6;
    return`<path d="M${cx-w/2},${cy-h/2} L${cx-w/2},${cy+h/2} A${w/2},${ry} 0 0 0 ${cx+w/2},${cy+h/2} L${cx+w/2},${cy-h/2}" ${st}/><ellipse cx="${cx}" cy="${cy-h/2}" rx="${w/2}" ry="${ry}" ${st}/><ellipse cx="${cx}" cy="${cy-h/2}" rx="${w/2}" ry="${ry}" fill="#fff" fill-opacity=".35" stroke="none"/>`}
  if(t==='kužeľ'){const w=s*.8,h=s*.85,ry=w/6;
    return`<path d="M${cx},${cy-h/2} L${cx+w/2},${cy+h/2} A${w/2},${ry} 0 0 1 ${cx-w/2},${cy+h/2} Z" ${st}/><path d="M${cx+w/2},${cy+h/2} A${w/2},${ry} 0 0 0 ${cx-w/2},${cy+h/2}" fill="none" stroke="#1f2937" stroke-width="2" stroke-dasharray="5 5"/>`}
  return'';
}
const shapeSVG=(t,w,col,rot)=>`<svg viewBox="0 0 120 120" width="${w}" height="${w}" style="display:block;margin:0 auto">${shapeEl(t,60,62,78,col,rot)}</svg>`;
EXTRA_MATH.shapes=function(){
  const pool=store.get('shapes3d',false)?[...SH2,...SH3]:SH2;
  const next=wqueue(pool,x=>['T:'+x]);
  return()=>{
    const t=next(), col=rand(SH_COL), rot=rand([0,0,0,15,-15,30,45]);
    const q=rand(SH2.includes(t)?['name','find','count']:['name','find']);
    const others=shuffle(pool.filter(x=>x!==t)).slice(0,3);
    if(q==='name')return{label:'🔺 Tvary',prompt:`<div class="q">Ktorý je to tvar?</div>${shapeSVG(t,190,col,rot)}`,
      optClass:'txt four names',options:shuffle([t,...others]).map(o=>({html:esc(csw(o)),correct:o===t})),auto:'Ktorý je to tvar?',ok:t,track:['M:shapes','T:'+t]};
    if(q==='find'){const ask='Nájdi '+(SH_ACC[t]||t);
      return{label:'🔺 Tvary',prompt:`<div class="q">${esc(ask)}</div><button class="sp" id="spk">🔊 Počúvaj</button>`,
        optClass:'four shp',options:shuffle([t,...others]).map(o=>({html:shapeSVG(o,92,rand(SH_COL),rand([0,0,20,-20])),correct:o===t})),
        auto:ask,ok:'Áno, '+t,track:['M:shapes','T:'+t],bind(){$('spk').onclick=()=>say(ask,0.85)}};}
    // spočítaj tvary v obrázku
    const n=ri(5,10), cells=shuffle(Array.from({length:12},(_,i)=>i)).slice(0,n);
    let types=cells.map(()=>rand(SH2)); if(!types.includes(t))types[0]=t;
    const r=types.filter(x=>x===t).length;
    const els=cells.map((c,i)=>shapeEl(types[i],40+(c%4)*80+ri(-8,8),40+Math.floor(c/4)*80+ri(-6,6),52,rand(SH_COL),rand([0,0,15,-15,30]))).join('');
    const ask=`Koľko je tu ${SH_GEN[t]}?`;
    return{label:'🔺 Tvary',prompt:`<div class="q">${esc(ask)}</div><svg viewBox="0 0 320 240" style="width:100%;max-width:340px;display:block;margin:6px auto">${els}</svg>`,
      optClass:'pad',options:padOptions(r,10),auto:ask,ok:String(r),track:['M:shapes']};
  };
};

function mixMaker(makers){let i=0;const ms=shuffle(makers);return()=>ms[(i++)%ms.length]()}

  const m=[];
  if(getWords().filter(x=>canRead(x.w)).length)m.push(wordMaker());
  if(getSents().filter(x=>canRead(x[0])).length)m.push(sentMaker());

/* =====================================================================
   ČÍTANIE SO SVETIELKOM – text sa rozsvecuje písmenko po písmenku
   (alebo po slabikách), aby dieťa čítalo zľava doprava a spájalo hlásky do slabík
   ===================================================================== */
function flUnits(text){
  const out=[]; let sid=0;
  text.split(' ').forEach((w,wi)=>{
    if(wi>0)out.push({t:' ',sp:true});
    const letters=[];
    for(let k=0;k<w.length;k++){const two=w.slice(k,k+2).toLocaleLowerCase('sk');if(['ch','dz','dž'].includes(two)){letters.push(w.slice(k,k+2));k++}else letters.push(w[k])}
    const syls=syllabify(w.replace(/[.,!?]/g,'')).split('-');
    let si=0, rem=syls[0]?syls[0].length:0;
    letters.forEach(ch=>{
      if(/[.,!?]/.test(ch)){out.push({t:ch,pu:true,w:wi});return}
      out.push({t:ch,syl:sid+si,w:wi}); rem-=ch.length;
      if(rem<=0&&si<syls.length-1){si++;rem=syls[si].length}
    });
    sid+=syls.length;
  });
  return out;
}

/* =====================================================================
   PÍŠ PRSTOM – dieťa obťahuje písmenko prstom, appka skontroluje,
   či obťahovalo celé písmenko a nešlo mimo neho
   ===================================================================== */
/* vyhodnotenie obťahovania: body ťahu musia ležať na písmenku (presnosť)
   a ťahy musia prejsť po všetkých častiach písmenka (pokrytie po oblastiach) */
function traceScore(strokes,o){
  const R=180, k=R/o.W, w=R, h=Math.max(20,Math.round(o.H*k)), N=w*h, fs=o.fit.fs*k;
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.font=`${o.weight} ${fs}px ${o.font}`;g.fillText(o.txt,o.fit.x*k,o.fit.y*k);
  const ga=g.getImageData(0,0,w,h).data, G=new Uint8Array(N); let gN=0;
  for(let i=0;i<N;i++)if(ga[i*4+3]>110){G[i]=1;gN++}
  const S2=Math.SQRT2;
  const dist=(src)=>{const D=new Float32Array(N);for(let i=0;i<N;i++)D[i]=src[i]?0:1e9;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;let d=D[i];if(x>0)d=Math.min(d,D[i-1]+1);if(y>0){d=Math.min(d,D[i-w]+1);if(x>0)d=Math.min(d,D[i-w-1]+S2);if(x<w-1)d=Math.min(d,D[i-w+1]+S2)}D[i]=d}
    for(let y=h-1;y>=0;y--)for(let x=w-1;x>=0;x--){const i=y*w+x;let d=D[i];if(x<w-1)d=Math.min(d,D[i+1]+1);if(y<h-1){d=Math.min(d,D[i+w]+1);if(x<w-1)d=Math.min(d,D[i+w+1]+S2);if(x>0)d=Math.min(d,D[i+w-1]+S2)}D[i]=d}
    return D};
  if(!gN)return{pass:true,cov:1,acc:1,minCell:1,needAcc:0};
  // polovičná hrúbka čiary písmenka
  const inv=new Uint8Array(N);for(let i=0;i<N;i++)inv[i]=G[i]?0:1;
  const DI=dist(inv); let half=0; for(let i=0;i<N;i++)if(G[i]&&DI[i]>half)half=DI[i];
  const DG=dist(G);
  // odhad dĺžky stredovej čiary písmenka (pre plnú čiaru hrúbky T je priemerná vzdialenosť od okraja ≈ T/4)
  let sDI=0; for(let i=0;i<N;i++)if(G[i])sDI+=DI[i]; const T=Math.max(2,4*sDI/gN), Lskel=gN/T;
  // body ťahu (prevzorkované každého pol pixela)
  const P=new Uint8Array(N), pts=[];
  strokes.forEach(s=>{for(let j=0;j<s.length;j++){const a=s[j],b=s[j+1]||a;const ax=a[0]*k,ay=a[1]*k,bx=b[0]*k,by=b[1]*k;
    const n=Math.max(1,Math.ceil(Math.hypot(bx-ax,by-ay)*2));for(let t=0;t<n;t++){const x=Math.round(ax+(bx-ax)*t/n),y=Math.round(ay+(by-ay)*t/n);
      if(x>=0&&y>=0&&x<w&&y<h){pts.push(y*w+x);P[y*w+x]=1}else pts.push(-1)}}});
  let plen=0; strokes.forEach(s=>{for(let j=1;j<s.length;j++)plen+=Math.hypot((s[j][0]-s[j-1][0])*k,(s[j][1]-s[j-1][1])*k)});
  const ratio=plen/Lskel;
  const tol=half*.45+fs*(o.cur?.035:.025)+1.5; // max. vzdialenosť bodu ťahu od okraja písmenka
  let inn=0; pts.forEach(i=>{if(i>=0&&DG[i]<=tol)inn++});
  const acc=pts.length?inn/pts.length:0;
  // pokrytie: pixel písmenka je pokrytý, ak je blízko nejakého bodu ťahu
  const DP=dist(P), cr=half*1.15+fs*.02+1.5;
  let x0=w,x1=0,y0=h,y1=0; for(let i=0;i<N;i++)if(G[i]){const x=i%w,y=(i/w)|0;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  const cols=Math.max(3,Math.min(12,Math.round((x1-x0+1)/((y1-y0+1)/3)))), rows=3;
  const cn=new Array(cols*rows).fill(0), cc=new Array(cols*rows).fill(0); let cov=0;
  for(let i=0;i<N;i++)if(G[i]){const x=i%w,y=(i/w)|0;const ci=Math.min(rows-1,((y-y0)*rows/(y1-y0+1))|0)*cols+Math.min(cols-1,((x-x0)*cols/(x1-x0+1))|0);
    cn[ci]++;if(DP[i]<=cr){cc[ci]++;cov++}}

  // každá samostatná časť (písmenko, mäkčeň, bodka, dĺžeň) musí byť obťahaná aspoň z polovice

    while(st.length){const q=st.pop();n++;if(DP[q]<=cr)cv++;const x=q%w,y=(q/w)|0;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const X=x+dx,Y=y+dy;if(X<0||Y<0||X>=w||Y>=h)continue;const j=Y*w+X;if(G[j]&&lab[j]<0){lab[j]=i;st.push(j)}}}
    if(n>=Math.max(4,gN*.004))minPart=Math.min(minPart,cv/n)}
  const needAcc=.8;
  return{pass:acc>=needAcc&&cov>=.8&&minCell>=.5&&minPart>=.5&&ratio<=3.5,cov,acc,minCell,minPart,ratio,needAcc,half,fs};
}
const TR_KINDS=[['letter','Písmenko'],['syl','Slabika'],['word','Slovo']];

          strokes.forEach(s=>{ctx.beginPath();s.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));if(s.length===1)ctx.lineTo(s[0][0]+.1,s[0][1]);ctx.stroke()});ctx.restore();
        };
        const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left),(e.clientY-r.top)]};
        cv.onpointerdown=e=>{if(done)return;e.preventDefault();cv.setPointerCapture(e.pointerId);cur=[pt(e)];strokes.push(cur);drawGuide()};
        cv.onpointermove=e=>{if(!cur)return;e.preventDefault();cur.push(pt(e));drawGuide()};
        cv.onpointerup=cv.onpointercancel=()=>{cur=null};
        // vyhodnotenie: presnosť ťahov a pokrytie celého písmenka (traceScore)
        const check=()=>{
          if(!strokes.length){$('trMsg').textContent='Najprv obťahuj písmenko prstom 👆';return}
          const r=traceScore(strokes,{W,H,fit,txt,font,weight,cur:style==='cur'}); window._trLast=r;
          if(r.pass){
            done=true; drawGuide('#bbf7d0');
            const stars=r.cov>.88&&r.acc>.9?3:r.cov>.8&&r.acc>.84?2:1;
            $('trMsg').innerHTML=`${'⭐'.repeat(stars)} ${stars===3?'Perfektné!':stars===2?'Výborne!':'Dobre!'}`;
            setTimeout(()=>finish(mistakes===0),700);
          }else{
            mistakes++; drawGuide('#fecaca'); setTimeout(()=>drawGuide(),900);
            $('trMsg').textContent=r.ratio>3.5?'Nečmáraj 🙂 Zmaž a obťahuj pekne po sivej čiare.':r.acc<r.needAcc?'Skús ísť presnejšie po sivom písmenku 🙂':'Ešte kúsok – obťahuj celé písmenko aj s mäkčeňmi a čiarkami 👆';
            owl('Skús to ešte raz 💪');
          }
        };
        $('trClr').onclick=()=>{strokes=[];drawGuide();$('trMsg').textContent='Obťahuj sivé písmenko prstom 👆'};
        $('trOk').onclick=check;
        $('trSkip').onclick=()=>{if(!done){done=true;finish(false)}};
        Promise.all([document.fonts.load(`${weight} 80px ${font}`)]).catch(()=>{}).then(()=>{fit=fitText(ctx,W,H);cv._o={W,H,fit,txt,font,weight,cur:style==='cur'};drawGuide()});
      }};
  };
}

const LIMITS=[0,10,15,20,30,45];
let tMem={d:'',sec:0}, tWarned=false, tLastSave=0;
function tLoad(){const t=store.get('tday',{d:'',sec:0,extra:0});if(t.d!==today())return{d:today(),sec:0,extra:0};return t}
function playedSec(){const t=tLoad();return Math.max(t.sec,tMem.d===today()?tMem.sec:0)}
function tSave(){const t=tLoad();t.sec=Math.max(t.sec,tMem.sec);store.set('tday',t);tLastSave=Date.now()}
function limitSec(){const l=store.get('limit',0);if(!l)return 0;return(l+tLoad().extra)*60}
function timerTick(){
  if(document.visibilityState!=='visible')return;
  if(tMem.d!==today())tMem={d:today(),sec:tLoad().sec};
  if($('stopOv'))return;
  tMem.sec+=10;
  if(Date.now()-tLastSave>60000)tSave();
  const lim=limitSec(); if(!lim)return;
  if(!tWarned&&lim-tMem.sec<=120&&lim-tMem.sec>0){tWarned=true;owl('Ešte 2 minútky a ideme si oddýchnuť 🙂');say('Ešte dve minútky a ideme si oddýchnuť.')}
  if(tMem.sec>=lim)showStop();
}
function showStop(){
  if($('stopOv'))return; tSave(); stopSpeak();
  const min=Math.round(playedSec()/60), a=ri(3,9), b=ri(4,9);
  const ov=document.createElement('div');ov.id='stopOv';
  ov.innerHTML=`<div class="stopc">
      <div style="display:flex;justify-content:center;align-items:flex-end;gap:4px"><span id="stopOwl">${owlSVG(110)}</span><span style="font-size:80px">🌳</span></div>

      <p>${g('Učil','Učila')} si sa ${min} minút. ${g('Si šikovný','Si šikovná')}! 🌟<br>Poď sa hrať von alebo si prečítaj knižku. Zajtra pokračujeme!</p>
      <details class="pgate"><summary>Pre rodiča</summary>
        <div class="muted">Koľko je ${a} × ${b}?</div>
        <input type="number" inputmode="numeric" id="pgIn" style="width:120px;font-size:22px;padding:6px;border-radius:10px;border:2px solid #e6d9c2">
        <button class="toggle on" id="pgOk">OK</button>
        <div id="pgBtns" style="display:none;margin-top:10px;gap:8px;flex-wrap:wrap;justify-content:center">
          <button class="toggle on" data-ext="5">+5 minút</button><button class="toggle on" data-ext="15">+15 minút</button><button class="toggle" data-ext="999">Dnes bez limitu</button>
        </div></details>
    </div>`;
  document.body.appendChild(ov);
  say((S.name?S.name+', ':'')+'dnes stačilo! Poď sa hrať von. Zajtra pokračujeme.');
  $('pgOk').onclick=()=>{if(+$('pgIn').value===a*b){$('pgBtns').style.display='flex'}else{$('pgIn').value='';$('pgIn').placeholder='skúste znova'}};
  ov.querySelectorAll('[data-ext]').forEach(x=>x.onclick=()=>{const t=tLoad();t.sec=Math.max(t.sec,tMem.sec);t.extra=(t.extra||0)+(+x.dataset.ext);store.set('tday',t);tWarned=false;ov.remove()});
}

  opt=opt||(kind==='write'?'letters':kind==='color'?'pics':'');
  main.innerHTML=`
    ${kind==='write'?(()=>{const cur=opt.startsWith('c'),m=cur?opt.slice(1):opt;return `<div class="tabs"><button class="tab ${m==='letters'?'on':''}" data-o="${cur?'c':''}letters">Písmenká</button><button class="tab ${m==='words'?'on':''}" data-o="${cur?'c':''}words">Slová</button></div>
      <div class="tabs"><button class="tab ${!cur?'on':''}" data-o="${m}">Tlačené</button><button class="tab ${cur?'on':''}" data-o="c${m}">✍️ Písané</button></div>`})():''}
    ${kind==='color'?`<div class="chips" style="margin-bottom:10px">${[['pics','🖍️ Obrázky'],['mandala','🌸 Mandala'],['cbn','🔢 Vypočítaj a vymaľuj'],['dots','✏️ Spoj bodky'],['maze','🐭 Bludisko'],['shapes','🔺 Tvary']].map(([k,l])=>`<button class="chip ${opt===k?'on':''}" data-o="${k}" style="min-width:0;padding:8px 12px;font-size:15px">${l}</button>`).join('')}</div>
      ${opt==='maze'?`<div class="tabs"><button class="tab ${!mazeHard?'on':''}" id="mzE">Ľahké</button><button class="tab ${mazeHard?'on':''}" id="mzH">Ťažké</button></div>`:''}
      ${opt==='cbn'?'<div class="muted" style="margin-bottom:8px">Príklady sú podľa rozsahu čísel nastaveného v Počítaní.</div>':''}`:''}
    <div id="sheetBox" class="muted" style="text-align:center;padding:40px">Pripravujem kartu…</div>
    <div style="display:flex;gap:8px">
      <button class="big-btn alt" id="kNew" style="flex:1">${kind==='color'?(opt==='pics'||opt==='cbn'||opt==='dots'?'➡ Ďalší obrázok':'🔄 Iná'):kind==='diploma'||kind==='endip'?'🔄 Iná farba':'🔄 Iná karta'}</button>
      <button class="big-btn" id="kDl" style="flex:1">⬇ Stiahnuť</button>
    </div>
    <div class="muted" id="kMsg" style="text-align:center;margin-top:8px"></div>`;
  if(kind==='write'||kind==='color')main.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>cardsView(kind,b.dataset.o));
  if($('mzE')){$('mzE').onclick=()=>{mazeHard=false;cardsView('color','maze')};$('mzH').onclick=()=>{mazeHard=true;cardsView('color','maze')}}
  const cv=await renderSheet(kind,opt);
  const url=cv.toDataURL('image/png');
  $('sheetBox').innerHTML=`<img class="sheet" src="${url}" alt="Karta na tlač">`;$('sheetBox').style.padding='0';
  $('kNew').onclick=()=>{if(kind==='color'){if(opt==='pics')colorIdx++;if(opt==='cbn')cbnIdx++;if(opt==='dots')dotIdx++}if(kind==='diploma'||kind==='endip')dipCol++;cardsView(kind,opt)};
  const names={enflash:'english-karticky',enwrite:'english-pisanie',enmatch:'english-spoj',enbingo:'english-bingo',endip:'english-certifikat',diploma:'diplom',write:(opt.endsWith('words')?'obtahuj-slova':'obtahuj-pismenka')+(opt.startsWith('c')?'-pisane':''),color:{pics:'vymaluj',mandala:'mandala',cbn:'vypocitaj-a-vymaluj',dots:'spoj-bodky',maze:'bludisko',shapes:'tvary'}[opt]||'vymaluj',math:'pocitaj'};
  $('kDl').onclick=()=>{
    if(!dlApi){ // samostatný web (napr. GitHub Pages): bežné stiahnutie
      cv.toBlob(b=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=names[kind]+'.png';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}catch(e){}
        $('kMsg').innerHTML='Ak sa karta nestiahla, podržte prst na obrázku a zvoľte <b>Uložiť</b> alebo <b>Zdieľať → Tlačiť</b>.'},'image/png');
      return}
    cv.toBlob(async b=>{
      try{const r=await dlApi.save({filename:names[kind]+'.png',data:b});$('kMsg').textContent=r.status==='saved'?'Uložené ✔ Teraz ju môžete vytlačiť.':''}
      catch(e){$('kMsg').innerHTML=e&&e.code==='declined'?'':'Sťahovanie tu nejde – podržte prst na obrázku a zvoľte <b>Uložiť</b>.'}
    },'image/png');
  };
}

// posluchače nastavení – registrované iba raz
main.addEventListener('click',e=>{
  const id=e.target.id;
});
main.addEventListener('change',e=>{if(e.target.id==='voiceSel'){store.set('voice',e.target.value);pickVoice();say('Ahoj! Ideme čítať.')}});
// Samostatný web (GitHub Pages): appka sa dá nainštalovať a funguje aj bez internetu.
// V Claude súbor manifest-de-demo.json neexistuje, takže sa nič nespustí.
(async()=>{try{
  const r=await fetch('manifest-de-demo.json',{cache:'no-store'}); if(!r.ok)return;
  const l=document.createElement('link');l.rel='manifest';l.href='manifest-de-demo.json';document.head.appendChild(l);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  PWA=true;
  if(/pridat|install/i.test(location.hash+location.search)&&!isStandalone())installView();
  else if(main.querySelector('.owlbox'))updInstall();
}catch(e){}})();
applyFont();
updStars();
if(!store.get('onboarded',false)&&S.stars>0)store.set('onboarded',true);
if(store.get('onboarded',false))home();else welcome();
// plná verzia: odomkne hlas a obmedzenia (ak je kód uložený); potom pokrok zo servera a obnoví úvod
licStartup().then(()=>{if(isFull()&&main.querySelector('.owlbox'))home()});
</script>
</body>
</html>
